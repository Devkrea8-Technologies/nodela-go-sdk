repos:
  - repo: local
    hooks:
      - id: go-fmt
        name: go fmt
        entry: bash -c 'gofmt -w -s .'
        language: system
        pass_filenames: false
      
      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        pass_filenames: false
      
      - id: go-test
        name: go test
        entry: go test ./...
        language: system
        pass_filenames: false
        